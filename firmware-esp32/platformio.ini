; platformio.ini — TurboUSD Node firmware (ESP32-S3 side)
; Target board: SenseCAP Indicator D1 (ESP32-S3 + RP2040 dual-MCU)
;
; Build with: pio run
; Flash with: pio run --target upload
; Serial monitor: pio device monitor

[env:sensecap_indicator_d1]
; pioarduino platform, IDF 5.5 line (Arduino-ESP32 3.x). TWO reasons for this
; fork AND this exact version line:
;   1. IDF 5.x exposes the RGB bounce buffer + LCD_RGB_RESTART_IN_VSYNC and
;      double-framebuffer tear-free mode. Stock espressif32@6.x (Arduino 2.0.x /
;      IDF 4.4.7) has none of it.
;   2. custom_sdkconfig below only actually recompiles the IDF libs from source
;      ("Hybrid Compile" — the ONLY way LCD_RGB_ISR_IRAM_SAFE / RESTART_IN_VSYNC /
;      SPIRAM_XIP reach the chip). That feature does NOT exist on the 5.1.x line
;      (which ended at 51.03.07 → builds came out silently precompiled). It first
;      shipped in the 53.x line, so we MUST be on 53/54/55. This pins 5.5.
; Requires the pioarduino CORE in CI (`pip install pioarduino`, not stock
; platformio) — see .github/workflows/build-and-release-firmware.yml.
; If this exact release 404s in CI, swap to the moving 'stable' tag:
;   https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1   ; closest generic profile; real pin mapping is
                              ; in include/board_pins.h (verified against
                              ; Seeed's reference firmware schematic).
framework = arduino

; The generated LVGL assets in ../assets/ used to be pulled in here, but the
; Hybrid Compile (from-source) build IGNORES build_src_filter ("the 'src_filter'
; option cannot be used with ESP-IDF"). They're now #included from
; src/asset_bundle.c instead, which IS inside src/ and always compiles. So this
; is just the default src/ set now.
build_src_filter = +<*>

; --- Partition scheme: custom CSV in this repo (8 MB flash, two OTA slots).
; default_ota.csv does NOT ship with espressif32@^6.0.0, so we include our
; own copy at firmware-esp32/partitions.csv.
board_build.partitions = partitions.csv

; --- PSRAM: ESP32-S3 on the D1 has 8 MB octal PSRAM (OPI mode).
; The RGB framebuffer (480×480×2 = ~450 KB) lives here.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; --- RGB-LCD stability (THE root fix for the random panel desync) -------------
; custom_sdkconfig puts pioarduino into "hybrid mode": it RECOMPILES the ESP-IDF
; components (esp_lcd, gdma...) from source with these Kconfig overrides, instead
; of linking the stock precompiled Arduino libs. This is the ONLY way the RGB
; panel bounce buffer becomes rock-steady:
;   * LCD_RGB_ISR_IRAM_SAFE -> the panel/DMA refill ISRs live in IRAM (and on IDF
;     5.5 it auto-`select`s the GDMA-in-IRAM handler that bounce mode needs), so
;     they keep feeding the panel even while the flash cache is disabled (every
;     LittleFS disk-cache write did this -> old builds "rolled" right here).
;   * LCD_RGB_RESTART_IN_VSYNC -> THE fix for the permanent horizontal/vertical
;     shift. When PSRAM bandwidth spikes (image decode + WiFi + XIP code fetch),
;     the DMA momentarily can't feed the panel as fast as it scans; the panel
;     emits dummy pixels and the DMA read-pointer and the panel's scan-pointer
;     latch a PERMANENT offset (Espressif's documented "permanently shifted
;     image"). This option resets the GDMA channel every VBlank so any desync is
;     re-aligned within one frame instead of sticking. Ref: ESP-IDF esp_lcd
;     Kconfig + RGB LCD "Bounce Buffer with Single PSRAM Frame Buffer" docs.
;   * SPIRAM_XIP_FROM_PSRAM + FETCH_INSTRUCTIONS + RODATA -> code/rodata execute
;     from PSRAM cache, so the CPU never stalls on flash and frees internal RAM.
;   * 64KB/64B data cache -> higher PSRAM->bounce DMA throughput.
; Lifted verbatim from pioarduino's own "OPI Performance -> Display use" example.
; NOTE: the first CI build after this change is a full from-source IDF compile
; (~15-25 min, cache miss); later builds are cached. Confirm the build log prints
; '*** Add "custom_sdkconfig" settings ***' -- that line = hybrid mode engaged.
custom_sdkconfig =
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
;   mbedTLS DYNAMIC buffers — the single biggest internal-RAM lever. A stock
;   TLS handshake pins ~45 KB of INTERNAL heap for the whole connection
;   (16K rx + 16K tx + handshake state). With WiFi (~70K) + the LVGL loop task
;   + 2-3 worker stacks alive, the 0.2.2 device sat at free≈18-21 KB and EVERY
;   https call returned -1 ("nothing loads": wallet scan, resolve-ordinal,
;   tickers list, charts, logos, ordinal art). DYNAMIC_BUFFER allocates the
;   rx/tx buffers per TLS record and frees them between records, dropping the
;   per-connection footprint to roughly a third; the FREE_* flags release the
;   CA chain and handshake config once the session is up.
    CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y
;   Task WDT headroom: the default 5 s tripped ("Reset reason: 6") during the
;   post-reconnect storm — back-to-back image decodes (lodepng/tjpgd have no
;   internal yields) plus disk-cache eviction bursts on core 0. The evict loop
;   now yields too; 12 s gives legitimate heavy phases room while still
;   catching real hangs. NOTE: changing custom_sdkconfig costs ONE slow
;   (~5 min) IDF rebuild in CI, then the cache makes builds fast again.
    CONFIG_ESP_TASK_WDT_TIMEOUT_S=12

; --- Trim unused bundled managed components (Hybrid Compile only) -------------
; A from-source build recompiles EVERY managed component Arduino-ESP32 bundles
; (modbus, speech-recog, rainmaker, zigbee, camera, diagnostics...). We use none
; of them, and esp-modbus outright FAILS a static_assert on the Hybrid base
; sdkconfig ("FMB_MASTER_MAX_API_BLOCKING_TIME_MS must be >= ...RESPOND"), which
; killed the first real from-source build. Removing them fixes that and shaves
; minutes off the compile. List mirrors pioarduino's own Tasmota example (also a
; WiFi-only device) so the inter-component deps are removed as a consistent set.
; NOTE: qrcode is safe to drop — we use LVGL's bundled qrcodegen, not the IDF
; component. If a later build errors on an Arduino LIBRARY wrapper (not an IDF
; component), add a matching lib_ignore entry (see the Tasmota example).
custom_component_remove =
    espressif/esp-modbus
    espressif/esp-sr
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/network_provisioning
    espressif/esp32-camera
    espressif/cbor
    espressif/qrcode
    espressif/libsodium
    chmorgan/esp-libhelix-mp3

monitor_speed = 115200
upload_speed = 921600

; Arduino-ESP32 3.x already compiles with a modern C++ standard (gnu++2b), so
; the old -std=gnu++11 unflag + -std=gnu++17 override are gone: forcing gnu++17
; globally would make the framework's own C++20/23 sources fail to build.
build_flags =
    -I include                      ; explicitly add firmware-esp32/include/ to GCC search path so
                                    ; LVGL library files can find lv_conf.h when compiling
    -D CORE_DEBUG_LEVEL=3
    -D FIRMWARE_VERSION=\"0.3.6\"
    ; RP2040 link uses GPIO19/20 (see config.h — proven by the "IMPROV" bytes on
    ; 43/44, which is the host/flasher UART). Native USB CDC OFF so the USB PHY
    ; releases 19/20 for UART2; the console rides UART0 (43/44 → the board bridge),
    ; and http://turbousd.local/logs works regardless.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM              ; enables PSRAM heap in Arduino-ESP32
    -D CONFIG_SPIRAM_USE_MALLOC     ; lets malloc() spill into PSRAM
    -D LV_CONF_INCLUDE_SIMPLE       ; makes LVGL do #include "lv_conf.h" via normal include path
    ; Belt-and-suspenders: define critical LVGL options directly so they reach
    ; LVGL library source files even if lv_conf.h include resolution fails.
    -D LV_USE_QRCODE=1
    -D LV_USE_PNG=1                  ; bundled lodepng for token logo decoding (screen_tickers.h)
    -D LV_USE_SJPG=1                 ; bundled tjpgd — DexScreener logos arrive as baseline JPEG
    -D LV_USE_CANVAS=1               ; lv_qrcode is a canvas wrapper; must be enabled or
                                    ; lv_qrcode.c fails with "'lv_canvas_class' undeclared"
    -D LV_USE_KEYBOARD=1
    -D LV_USE_TEXTAREA=1
    -D LV_USE_TILEVIEW=1
    -D LV_USE_FLEX=1
    -D LV_USE_CHART=1
    -D LV_COLOR_DEPTH=16
    -D LV_MEM_CUSTOM=1
    -D LV_FONT_MONTSERRAT_10=1
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_32=1
    -D LV_FONT_MONTSERRAT_48=1

lib_deps =
    lvgl/lvgl @ ^8.3.11
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8     ; placeholder if we later add MQTT for realtime mining pushes
    ; NOTE: No external QR library needed. LVGL 8.x bundles nayuki's qrcodegen.c/h
    ; inside src/extra/libs/qrcode/ and compiles it as part of the library.
    ; ricmoo/QRCode was removed — it uses a different API (qrcode.h / qrcode_initBytes)
    ; and is incompatible with LVGL's internal lv_qrcode widget which calls qrcodegen_*.
