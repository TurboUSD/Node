# .github/workflows/build-and-release-firmware.yml
#
# Triggered on every push to main that touches either firmware directory.
# Compiles both chips' firmware with PlatformIO, publishes the resulting
# .bin files as a GitHub Release, and then registers that release with
# Supabase so devices doing their daily OTA check can find it (see
# backend/functions/latest-firmware and ota_updater.h on the device side).
#
# Required repo secrets:
#   SUPABASE_URL              - https://YOUR-PROJECT-REF.supabase.co
#   SUPABASE_ANON_KEY         - anon/public key (safe to bake into firmware; RLS limits what it can do)
#   SUPABASE_SERVICE_ROLE_KEY - service role key (server-side only, never baked into firmware)

name: Build and Release Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware-esp32/**'
      - 'firmware-rp2040/**'
      - '.github/workflows/build-and-release-firmware.yml'
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

# The publish-release job uses softprops/action-gh-release to create a Release.
# Creating releases / uploading assets requires the workflow's GITHUB_TOKEN to
# have write access to repo contents. Without this block the token is read-only
# and the step fails with "Resource not accessible by integration".
# (If it still fails, also check Settings → Actions → General → Workflow
# permissions is set to "Read and write".)
permissions:
  contents: write

jobs:
  # Detect which firmware directory actually changed in this push, so we only
  # rebuild the chip that changed (an ESP32-only push no longer recompiles and
  # re-releases the RP2040, and vice-versa). Manual runs (workflow_dispatch)
  # build both.
  changes:
    runs-on: ubuntu-latest
    outputs:
      esp32:  ${{ steps.filter.outputs.esp32 }}
      rp2040: ${{ steps.filter.outputs.rp2040 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            esp32:
              - 'firmware-esp32/**'
            rp2040:
              - 'firmware-rp2040/**'

  build-esp32:
    needs: changes
    if: ${{ needs.changes.outputs.esp32 == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # MUST be the pioarduino CORE fork, installed as the `pioarduino` PyPI
      # package — NOT stock `pip install platformio`. `custom_sdkconfig` (the
      # from-source IDF rebuild that actually compiles in the RGB stability
      # flags: LCD_RGB_ISR_IRAM_SAFE, LCD_RGB_RESTART_IN_VSYNC,
      # SPIRAM_XIP_FROM_PSRAM) is a pioarduino-ONLY feature. Stock PlatformIO
      # runs the pioarduino *platform* fine but SILENTLY IGNORES custom_sdkconfig
      # and links the precompiled Arduino libs, so the display fixes never reach
      # the chip. The tell in the log: a ~40s build that only compiles LVGL +
      # FrameworkArduino (no esp_lcd/esp_psram/gdma from source) and no
      # '*** Add "custom_sdkconfig" settings ***' line. A correct from-source
      # build is ~15-25 min the first time, then cached. pioarduino's own CI
      # installs the core exactly this way.
      - name: Install pioarduino core (NOT stock platformio — needed for custom_sdkconfig)
        run: pip install -U pioarduino

      # Cache the PlatformIO toolchain, the pioarduino platform, and the build
      # directory. The FROM-SOURCE Arduino/IDF build (needed for custom_sdkconfig
      # → the RGB flags) is slow (~20-40 min) the first time; later pushes reuse
      # the compiled framework and SCons only recompiles changed sources (~2 min).
      #
      # CRITICAL: also cache the GENERATED sdkconfig marker files. pioarduino's
      # Hybrid Compile REINSTALLS + recompiles the whole Arduino framework (~4 min)
      # on EVERY run UNLESS it finds a project-dir `sdkconfig.defaults` whose
      # leading `# TASMOTA__<hash>` fingerprint matches the current custom_sdkconfig.
      # Those files live in the project root (NOT in .pio), so before we cached them
      # the framework rebuilt every run even on a clean cache hit (~5 min builds
      # instead of ~2). Caching them makes the marker survive the fresh checkout →
      # the framework recompile is skipped.
      #
      # The `-v2` in the key forces ONE fresh cache save that captures those marker
      # files (a cache HIT never re-saves, so a path-only change wouldn't take).
      # After that one build, pushes that don't touch platformio.ini are ~2 min.
      # The key is hashed on platformio.ini so it auto-refreshes when the platform
      # or custom_sdkconfig changes; restore-keys reuse the newest cache otherwise.
      - name: Cache PlatformIO build
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware-esp32/.pio
            firmware-esp32/sdkconfig.defaults
            firmware-esp32/sdkconfig.sensecap_indicator_d1
          key: pio-esp32-v2-${{ runner.os }}-${{ hashFiles('firmware-esp32/platformio.ini') }}
          restore-keys: |
            pio-esp32-v2-${{ runner.os }}-
            pio-esp32-${{ runner.os }}-

      - name: Inject Supabase credentials into config.h
        run: |
          PROJECT_REF=$(echo "${{ secrets.SUPABASE_URL }}" | sed 's|https://||' | sed 's|\.supabase\.co||')
          sed -i "s|YOUR-PROJECT-REF|${PROJECT_REF}|g" firmware-esp32/include/config.h
          sed -i "s|YOUR-SUPABASE-ANON-KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" firmware-esp32/include/config.h

      # OpenSea now returns 401 to keyless requests on the account-NFTs
      # endpoint, so the NFT Gallery needs a (free) API key baked in. Set the
      # OPENSEA_API_KEY repo secret; if it's absent this step is a no-op and
      # the gallery will show a clear "needs API key" error on-device.
      - name: Inject OpenSea API key into config.h (optional)
        env:
          OPENSEA_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          if [ -n "$OPENSEA_KEY" ]; then
            sed -i "s|#define OPENSEA_API_KEY .*|#define OPENSEA_API_KEY \"$OPENSEA_KEY\"|" firmware-esp32/include/config.h
            echo "OpenSea key injected."
          else
            echo "No OPENSEA_API_KEY secret set — NFT gallery will require it at runtime."
          fi

      - name: Build ESP32-S3 firmware
        working-directory: firmware-esp32
        run: pio run

      # GUARD: prove the from-source build actually happened. This is the exact
      # failure that shipped broken firmware before — stock platformio silently
      # ignored custom_sdkconfig and produced a ~40s precompiled-libs build with
      # NONE of the RGB stability flags, which still flashes and boots but keeps
      # flickering/shifting. A real from-source build resolves our overrides into
      # a generated sdkconfig (sdkconfig.<env> holds "CONFIG_..=y"; config/
      # sdkconfig.h holds "#define CONFIG_.. 1"); a precompiled build has neither.
      # platformio.ini is the SOURCE of the "=y" line, so it is excluded here.
      - name: Verify custom_sdkconfig took effect (no silent precompiled build)
        working-directory: firmware-esp32
        run: |
          HITS=$(grep -rslE "CONFIG_LCD_RGB_RESTART_IN_VSYNC(=y| 1)" .pio sdkconfig* 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "OK: custom_sdkconfig engaged (from-source IDF build). Resolved in:"
            echo "$HITS"
          else
            echo "::error::custom_sdkconfig was IGNORED — this is a precompiled-libs build; the RGB flicker/shift fixes are NOT in this firmware."
            echo "Fix: the install step must use the pioarduino core ('pip install pioarduino', NOT stock 'platformio')."
            echo "If it still fails on platform 51.03.07 with framework=arduino, set 'framework = arduino, espidf' in platformio.ini."
            exit 1
          fi

      - name: Extract version from platformio.ini
        id: extract_version
        working-directory: firmware-esp32
        run: |
          VERSION=$(grep -oP 'FIRMWARE_VERSION=\\"\K[^\\]+' platformio.ini)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(sha256sum firmware-esp32/.pio/build/sensecap_indicator_d1/firmware.bin | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Package release binaries (OTA app image + web-flasher factory image)
        run: |
          pip install "esptool>=4,<5" --quiet   # 4.x keeps the merge_bin / --flash_* syntax used below
          BUILD=firmware-esp32/.pio/build/sensecap_indicator_d1
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)

          # 1) OTA image = the bare app binary. The device's OTA updater (Update.h)
          #    writes this to the inactive app slot, so it must stay app-only.
          cp $BUILD/firmware.bin esp32s3-${{ steps.extract_version.outputs.version }}.bin

          # 2) Web-flasher parts. The manifest (firmware-esp32/manifest.json) flashes
          #    these at their real offsets SEPARATELY rather than as one merged blob
          #    starting at 0x0. A merged blob spans the NVS partition (0x9000) and
          #    fills it with 0xFF, so every web re-flash wiped the saved WiFi creds
          #    even when the user didn't ask to erase. Writing discrete parts skips
          #    the NVS region (0x9000) entirely, so updates keep WiFi + settings.
          #    Offsets match firmware-esp32/partitions.csv.
          cp "$BUILD/bootloader.bin" bootloader.bin
          cp "$BUILD/partitions.bin" partitions.bin
          cp "$BOOT_APP0"            boot_app0.bin
          cp "$BUILD/firmware.bin"   app.bin

          # Also keep a merged single-file image for manual full flashes / recovery
          # (esptool write_flash 0x0 firmware-esp32s3.bin — this DOES erase NVS).
          python -m esptool --chip esp32s3 merge_bin -o firmware-esp32s3.bin \
            --flash_mode dio --flash_size 8MB \
            0x0     "$BUILD/bootloader.bin" \
            0x8000  "$BUILD/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin"

      - name: Update manifest version
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" firmware-esp32/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: |
            esp32s3-${{ steps.extract_version.outputs.version }}.bin
            firmware-esp32s3.bin
            bootloader.bin
            partitions.bin
            boot_app0.bin
            app.bin
            firmware-esp32/manifest.json

      - name: Save sha for downstream job
        run: echo "${{ steps.sha.outputs.sha256 }}" > esp32s3-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-sha256
          path: esp32s3-sha256.txt

  build-rp2040:
    needs: changes
    if: ${{ needs.changes.outputs.rp2040 == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build RP2040 firmware
        working-directory: firmware-rp2040
        run: pio run

      - name: Extract version from platformio.ini
        id: extract_version
        working-directory: firmware-rp2040
        run: |
          VERSION=$(grep -oP 'FIRMWARE_VERSION=\\"\K[^\\]+' platformio.ini)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: sha
        run: |
          # earlephilhower/arduino-pico outputs a .uf2 (drag-and-drop flashable)
          SHA=$(sha256sum firmware-rp2040/.pio/build/rp2040_buzzer/firmware.uf2 | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Rename UF2 for release
        run: cp firmware-rp2040/.pio/build/rp2040_buzzer/firmware.uf2 rp2040-${{ steps.extract_version.outputs.version }}.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: rp2040-firmware
          path: rp2040-${{ steps.extract_version.outputs.version }}.uf2

      - name: Save sha for downstream job
        run: echo "${{ steps.sha.outputs.sha256 }}" > rp2040-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rp2040-sha256
          path: rp2040-sha256.txt

  publish-release:
    needs: [changes, build-esp32, build-rp2040]
    # Run as long as at least one chip actually built (the other may be skipped
    # because it didn't change). !cancelled() lets us proceed past skipped needs.
    if: ${{ !cancelled() && (needs.build-esp32.result == 'success' || needs.build-rp2040.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download ESP32 artifacts
        if: needs.build-esp32.result == 'success'
        uses: actions/download-artifact@v4
        with: { name: esp32s3-firmware, path: ./artifacts }
      - name: Download ESP32 sha
        if: needs.build-esp32.result == 'success'
        uses: actions/download-artifact@v4
        with: { name: esp32s3-sha256, path: ./artifacts }
      - name: Download RP2040 artifacts
        if: needs.build-rp2040.result == 'success'
        uses: actions/download-artifact@v4
        with: { name: rp2040-firmware, path: ./artifacts }
      - name: Download RP2040 sha
        if: needs.build-rp2040.result == 'success'
        uses: actions/download-artifact@v4
        with: { name: rp2040-sha256, path: ./artifacts }

      - name: Compute release tag
        id: tag
        # softprops/action-gh-release does NOT expose a `tag_name` output, so the
        # Supabase registration below (which built the OTA binary_url from
        # steps.release.outputs.tag_name) got an EMPTY tag → a 404 download URL
        # (…/releases/download//esp32s3-x.bin). That was the "OTA download failed
        # HTTP 404" bug. Compute the tag ONCE and reuse it for BOTH the release
        # and the registration so the URL always points at a real asset.
        run: echo "name=fw-${{ needs.build-esp32.outputs.version || needs.build-rp2040.outputs.version }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          # Fall back to whichever chip built for the tag/version.
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            artifacts/esp32s3-*.bin
            artifacts/firmware-esp32s3.bin
            artifacts/bootloader.bin
            artifacts/partitions.bin
            artifacts/boot_app0.bin
            artifacts/app.bin
            artifacts/firmware-esp32/manifest.json
            artifacts/rp2040-*.uf2
          fail_on_unmatched_files: false   # only the built chip's files exist
          generate_release_notes: true

      - name: Register ESP32 release with Supabase
        if: needs.build-esp32.result == 'success'
        run: |
          ESP32_SHA=$(cat artifacts/esp32s3-sha256.txt)
          ESP32_URL=$(ls artifacts/esp32s3-*.bin | xargs -I{} basename {})
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/firmware_releases" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"target\":\"esp32s3\",\"version\":\"${{ needs.build-esp32.outputs.version }}\",\"binary_url\":\"https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/$ESP32_URL\",\"sha256\":\"$ESP32_SHA\"}"

      - name: Register RP2040 release with Supabase
        if: needs.build-rp2040.result == 'success'
        run: |
          RP2040_SHA=$(cat artifacts/rp2040-sha256.txt)
          RP2040_URL=$(ls artifacts/rp2040-*.uf2 | xargs -I{} basename {})
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/firmware_releases" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"target\":\"rp2040\",\"version\":\"${{ needs.build-rp2040.outputs.version }}\",\"binary_url\":\"https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/$RP2040_URL\",\"sha256\":\"$RP2040_SHA\"}"
